services:
  web:
    healthcheck:
      interval: 1s
    ports: !override
      - "127.0.0.1::8080"
    environment:
      MOONHUB_ROOT_USER: root
  ssh:
    healthcheck:
      interval: 1s
    ports: !override
      - "127.0.0.1::2222"

secrets:
  root_password:
    file: ${MOONHUB_SMOKE_SECRET:?Run scripts/docker-smoke.sh}
