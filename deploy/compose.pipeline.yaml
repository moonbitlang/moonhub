services:
  web:
    networks:
      default: null
      pipeline:
        ipv4_address: ${MOONHUB_PIPELINE_PREFIX:-172.30.90}.10

  pipeline-docker:
    image: docker:27.5.1-dind
    privileged: true
    # Keep the image entrypoint for cgroup nesting. Explicit dockerd prevents
    # the entrypoint from adding its default TCP listeners.
    command:
      - dockerd
      - --host=unix:///run/moonhub-docker/docker.sock
      - --group=10001
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - pipeline-socket:/run/moonhub-docker
      - pipeline-control:/var/lib/moonhub/provider
      - pipeline-docker-data:/var/lib/docker
    networks:
      pipeline:
        ipv4_address: ${MOONHUB_PIPELINE_PREFIX:-172.30.90}.11
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/moonhub-docker/docker.sock", "info"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  pipeline-provider:
    image: ${MOONHUB_PROVIDER_IMAGE:-moonhub:provider}
    build:
      context: .
      target: provider
      args:
        MOONBIT_VERSION: ${MOONBIT_VERSION:-0.10.14+7d59c7ec9}
    depends_on:
      web:
        condition: service_healthy
      pipeline-docker:
        condition: service_healthy
    command: ["--allow-http"]
    environment:
      MOONHUB_SERVER: http://web:8080
      MOONHUB_RUNNER_SERVER: http://${MOONHUB_PIPELINE_PREFIX:-172.30.90}.10:8080
      MOONHUB_RUNNER_NETWORK: bridge
      MOONHUB_RUNNER_IMAGE: ${MOONHUB_RUNNER_IMAGE:?Set MOONHUB_RUNNER_IMAGE to a registry image or digest}
      MOONHUB_RUNNER_HOST: ""
      MOONHUB_RUNNER_HOST_IP: ""
      MOONHUB_RUNNER_MEMORY: ${MOONHUB_RUNNER_MEMORY:-512m}
      MOONHUB_RUNNER_CPUS: ${MOONHUB_RUNNER_CPUS:-1}
      MOONHUB_RUNNER_PIDS_LIMIT: ${MOONHUB_RUNNER_PIDS_LIMIT:-256}
      MOONHUB_PROVIDER_WORKSPACE: /var/lib/moonhub/provider
      DOCKER_HOST: unix:///run/moonhub-docker/docker.sock
    secrets:
      - provider_token
    volumes:
      - pipeline-socket:/run/moonhub-docker
      - pipeline-control:/var/lib/moonhub/provider
    networks:
      pipeline:
        ipv4_address: ${MOONHUB_PIPELINE_PREFIX:-172.30.90}.12
    restart: unless-stopped

volumes:
  pipeline-socket:
  pipeline-control:
  pipeline-docker-data:

secrets:
  provider_token:
    file: ${MOONHUB_PROVIDER_TOKEN_FILE:-./deploy/secrets/provider_token}

networks:
  pipeline:
    name: ${MOONHUB_PIPELINE_NETWORK:-moonhub_pipeline}
    ipam:
      config:
        - subnet: ${MOONHUB_PIPELINE_PREFIX:-172.30.90}.0/24
