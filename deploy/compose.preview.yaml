name: moonhub-preview

services:
  web:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      MOONHUB_ROOT_USER: preview
      MOONHUB_SSH_PUBLIC_URL: ""
      MOONHUB_SSH_INTERNAL_URL: ssh://git@ssh:2222
      MOONHUB_IMPORT_TIMEOUT_SECONDS: "300"
    volumes: !override
      - data:/data
      - ./deploy/secrets/preview-import:/run/secrets/ssh-import:ro
    healthcheck:
      interval: 2s

  ssh:
    ports: !override
      - "127.0.0.1:12222:2222"
    healthcheck:
      interval: 2s

secrets:
  root_password:
    file: ./deploy/secrets/preview_password
