AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated MoonHub disposable ASG workers
Parameters:
  GuestPlatform:
    Type: String
    Default: windows
    AllowedValues: [windows, linux, macos]
  Image:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: m6a.large
  MacInstanceType:
    Type: String
    Default: mac2.metal
    AllowedValues: [mac2.metal, mac2-m2.metal, mac2-m2pro.metal, mac2-m1ultra.metal, mac-m4.metal, mac-m4pro.metal]
  MacHostResourceGroupArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:resource-groups:[^:]+:[0-9]{12}:group/.+$'
  MacAvailabilityZone:
    Type: String
    Default: ''
  MacRootDeviceName:
    Type: String
    Default: /dev/sda1
    AllowedPattern: '^/dev/[a-zA-Z0-9]+$'
  MacRootVolumeSize:
    Type: Number
    Default: 160
    MinValue: 80
    MaxValue: 1024
  MaxWorkers:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 20
Conditions:
  IsWindows: !Equals [!Ref GuestPlatform, windows]
  IsMac: !Equals [!Ref GuestPlatform, macos]
Rules:
  MacDedicatedPlacement:
    RuleCondition: !Equals [!Ref GuestPlatform, macos]
    Assertions:
      - Assert: !Not [!Equals [!Ref MacHostResourceGroupArn, '']]
        AssertDescription: EC2 Mac requires a Dedicated Host resource group ARN.
      - Assert: !Not [!Equals [!Ref MacAvailabilityZone, '']]
        AssertDescription: Select an Availability Zone with the Mac instance type.
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !If [IsMac, 10.247.0.0/24, !If [IsWindows, 10.249.0.0/24, 10.248.0.0/24]]
      EnableDnsSupport: true
      EnableDnsHostnames: true
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: !If [IsMac, 10.247.0.0/24, !If [IsWindows, 10.249.0.0/24, 10.248.0.0/24]]
      AvailabilityZone: !If [IsMac, !Ref MacAvailabilityZone, !Ref 'AWS::NoValue']
      VpcId: !Ref Network
      MapPublicIpOnLaunch: true
  Internet:
    Type: AWS::EC2::InternetGateway
  Connection:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref Internet
      VpcId: !Ref Network
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: Connection
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Internet
  Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet
  GuestSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [IsMac, Outbound web access for disposable macOS CI, !If [IsWindows, Outbound HTTPS for disposable Windows CI, Outbound web access for disposable Linux CI]]
      VpcId: !Ref Network
      SecurityGroupEgress:
        # Windows fetches some certificate revocation lists over HTTP.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  Bootstrap:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      Policies:
        - PolicyName: bootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/moonhub-runner/${AWS::StackName}/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/MoonHubInstanceArn': '${ec2:SourceInstanceARN}'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Bootstrap
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref Image
        InstanceType: !If [IsMac, !Ref MacInstanceType, !Ref InstanceType]
        Placement: !If
          - IsMac
          - Tenancy: host
            HostResourceGroupArn: !Ref MacHostResourceGroupArn
          - !Ref 'AWS::NoValue'
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref GuestSecurity
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: !If [IsMac, !Ref MacRootDeviceName, /dev/sda1]
            Ebs:
              Encrypted: true
              DeleteOnTermination: true
              VolumeType: gp3
              VolumeSize: !If [IsMac, !Ref MacRootVolumeSize, !If [IsWindows, !Ref 'AWS::NoValue', 40]]
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: !If [IsMac, MoonHubMacosVmPool, !If [IsWindows, MoonHubWindowsVmPool, MoonHubLinuxVmPool]]
                Value: !Ref AWS::StackName
  Group:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: InternetRoute
    Properties:
      MinSize: '0'
      MaxSize: !Ref MaxWorkers
      DesiredCapacity: '0'
      NewInstancesProtectedFromScaleIn: true
      HealthCheckType: EC2
      HealthCheckGracePeriod: !If [IsMac, 1200, !Ref 'AWS::NoValue']
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: !If [IsMac, MoonHubMacosVmPool, !If [IsWindows, MoonHubWindowsVmPool, MoonHubLinuxVmPool]]
          Value: !Ref AWS::StackName
          PropagateAtLaunch: true
Outputs:
  AutoScalingGroup:
    Value: !Ref Group
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
  LaunchTemplateVersion:
    Value: !GetAtt LaunchTemplate.LatestVersionNumber
  WorkerRole:
    Value: !GetAtt Bootstrap.Arn
  BootstrapPrefix:
    Value: !Sub '/moonhub-runner/${AWS::StackName}'
