AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated MoonHub disposable ASG workers
Parameters:
  GuestPlatform:
    Type: String
    Default: windows
    AllowedValues: [windows, linux]
  Image:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: m6a.large
  MaxWorkers:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 20
Conditions:
  IsWindows: !Equals [!Ref GuestPlatform, windows]
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !If [IsWindows, 10.249.0.0/24, 10.248.0.0/24]
      EnableDnsSupport: true
      EnableDnsHostnames: true
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: !If [IsWindows, 10.249.0.0/24, 10.248.0.0/24]
      VpcId: !Ref Network
      MapPublicIpOnLaunch: true
  Internet:
    Type: AWS::EC2::InternetGateway
  Connection:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref Internet
      VpcId: !Ref Network
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: Connection
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Internet
  Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet
  GuestSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [IsWindows, Outbound HTTPS for disposable Windows CI, Outbound web access for disposable Linux CI]
      VpcId: !Ref Network
      SecurityGroupEgress:
        # Windows fetches some certificate revocation lists over HTTP.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  Bootstrap:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      Policies:
        - PolicyName: bootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/moonhub-runner/${AWS::StackName}/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/MoonHubInstanceArn': '${ec2:SourceInstanceARN}'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Bootstrap
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref Image
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref GuestSecurity
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              DeleteOnTermination: true
              VolumeType: gp3
              VolumeSize: !If [IsWindows, !Ref 'AWS::NoValue', 40]
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: !If [IsWindows, MoonHubWindowsVmPool, MoonHubLinuxVmPool]
                Value: !Ref AWS::StackName
  Group:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: InternetRoute
    Properties:
      MinSize: '0'
      MaxSize: !Ref MaxWorkers
      DesiredCapacity: '0'
      NewInstancesProtectedFromScaleIn: true
      HealthCheckType: EC2
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: !If [IsWindows, MoonHubWindowsVmPool, MoonHubLinuxVmPool]
          Value: !Ref AWS::StackName
          PropagateAtLaunch: true
Outputs:
  AutoScalingGroup:
    Value: !Ref Group
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
  LaunchTemplateVersion:
    Value: !GetAtt LaunchTemplate.LatestVersionNumber
  WorkerRole:
    Value: !GetAtt Bootstrap.Arn
  BootstrapPrefix:
    Value: !Sub '/moonhub-runner/${AWS::StackName}'
