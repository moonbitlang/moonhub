name: Frontend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Read production MoonBit version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pins = [...fs.readFileSync('deploy/base.Dockerfile', 'utf8').matchAll(/^ARG MOONBIT_VERSION=(\d+\.\d+\.\d+\+[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*)$/gm)];
          assert.equal(pins.length, 1, 'Expected one exact production MoonBit pin');
          fs.appendFileSync(process.env.GITHUB_ENV, `MOONBIT_VERSION=${pins[0][1]}\n`);
          NODE
      - name: Install MoonBit
        run: |
          sh deploy/install-moonbit.sh "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify MoonBit version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const actual = execFileSync('moonc', ['-v'], { encoding: 'utf8' }).trim();
          assert.equal(actual.split(/\s/)[0], `v${process.env.MOONBIT_VERSION}`, actual);
          NODE
      - name: Resolve MoonBit dependencies
        run: |
          moon update
          node scripts/resolve-dependencies.cjs
      - run: npm ci --prefix js --no-audit --no-fund
      - name: Pull the matching Playwright browser image
        run: |
          version=$(node -p "require('./js/package-lock.json').packages['node_modules/@playwright/test'].version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          docker pull "$image"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build frontend assets
        run: npm run build --prefix js
      - name: Check TypeScript
        run: npm run check --prefix js
      - name: Build browser fixture server and diff worker
        run: moon build --target native --strip -j 1 --deny-warn . cmd/moonhub-diff-worker
      - name: Test browser interactions
        run: |
          node js/scripts/browser-server.mjs > "$RUNNER_TEMP/moonhub-browser-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/moonhub-browser-fixture.log"' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18092/-/login; then ready=1; break; fi
            kill -0 "$fixture_pid" || exit 1
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --init --ipc=host --network=host \
            --env CI=true --env PLAYWRIGHT_HTML_OPEN=never \
            --env MOONHUB_TEST_URL=http://127.0.0.1:18092 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace/js "$PLAYWRIGHT_IMAGE" \
            npm run test:browser -- --reporter=line,html --trace=retain-on-failure
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            js/playwright-report/
            js/test-results/
          if-no-files-found: ignore
          retention-days: 7
