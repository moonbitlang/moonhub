name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'moonbitlang/moonhub' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: production
    concurrency:
      group: moonhub-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: moonhub-deploy-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Deploy mirrored master through SSM
        env:
          MOONHUB_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          MOONHUB_DEPLOY_DOCUMENT: MoonHub-Deploy
        run: node scripts/github-deploy.cjs
