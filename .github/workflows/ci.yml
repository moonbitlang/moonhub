name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy production after full CI (master only)
        type: boolean
        default: false

permissions:
  contents: read

# Only superseded PR runs are canceled. Never cancel a production upgrade.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-check:
    name: Self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read production MoonBit version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pins = [...fs.readFileSync('deploy/base.Dockerfile', 'utf8').matchAll(/^ARG MOONBIT_VERSION=(\d+\.\d+\.\d+\+[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*)$/gm)];
          assert.equal(pins.length, 1, 'Expected one exact production MoonBit pin');
          fs.appendFileSync(process.env.GITHUB_ENV, `MOONBIT_VERSION=${pins[0][1]}\n`);
          NODE
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify MoonBit version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const actual = execFileSync('moonc', ['-v'], { encoding: 'utf8' }).trim();
          assert.equal(actual.split(/\s/)[0], `v${process.env.MOONBIT_VERSION}`, actual);
          NODE
      - name: Build and test MoonHub
        run: node scripts/self-check.cjs

  docker-ssh:
    name: Docker SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and exercise HTTP and Git SSH
        run: bash scripts/docker-smoke.sh

  windows-runner:
    name: Windows runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install production MoonBit version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = [regex]::Match((Get-Content deploy/base.Dockerfile -Raw), '(?m)^ARG MOONBIT_VERSION=(\S+)\r?$').Groups[1].Value
          if (-not $pin) { throw 'Missing production MoonBit pin' }
          $env:MOONBIT_INSTALL_VERSION = $pin
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/install-moonbit.ps1"
          & "$env:RUNNER_TEMP/install-moonbit.ps1"
          if (-not $?) { throw 'MoonBit installation failed' }
          "$env:USERPROFILE/.moon/bin" >> $env:GITHUB_PATH
      - name: Build Windows worker and task runtime
        shell: pwsh
        run: |
          moon update
          if ($LASTEXITCODE -ne 0) { throw 'Mooncakes index failed' }
          node scripts/resolve-dependencies.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
          ./scripts/build-windows-runner.ps1
      - name: Test Windows paths, shells, actions and process cleanup
        shell: pwsh
        run: |
          $env:PATH = "$pwd/.tmp/windows-runner/bin;$pwd/.tmp/windows-runner/pwsh;$pwd/.tmp/windows-runner/git/cmd;$pwd/.tmp/windows-runner/git/usr/bin;$env:PATH"
          moon test --target native --strip -j 1 --deny-warn runner/platform provider
          if ($LASTEXITCODE -ne 0) { throw 'Platform tests failed' }
          node --test runner/actions/runtime.windows.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Action runtime tests failed' }
          node scripts/windows-launcher-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Process cleanup tests failed' }
          node scripts/windows-runner-cancellation-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Runner cancellation tests failed' }
          node scripts/windows-provider-preflight-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows 11 preflight regression failed' }
      - name: Build Windows Server 2022 task image
        shell: pwsh
        run: |
          node --test scripts/prepare-windows-docker-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker readiness regressions failed' }
          node scripts/prepare-windows-docker.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker daemon is not ready' }
          docker build --isolation=process -f deploy/windows/Dockerfile -t moonhub:runner-windows .tmp/windows-runner
          if ($LASTEXITCODE -ne 0) { throw 'Windows task image build failed' }
      - name: Exercise reusable Windows worker with real containers
        shell: pwsh
        run: |
          node scripts/windows-runner-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows container smoke failed' }
      - name: Install and exercise a standalone Windows provider
        shell: pwsh
        run: |
          node scripts/windows-runner-smoke.cjs --standalone
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows provider smoke failed' }

  macos-runner:
    name: macOS runner
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build native macOS guest bundle
        run: |
          test "$(uname -m)" = arm64
          pin=$(sed -n 's/^ARG MOONBIT_VERSION=//p' deploy/base.Dockerfile)
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$pin"
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon update
          node scripts/resolve-dependencies.cjs
          python3 scripts/build-macos-runner.py
      - name: Test native runtime and prepared-slot lifecycle
        run: |
          moon build --strip -j 1 --deny-warn cmd/moonhub-runner
          moon test --strip -j 1 --deny-warn runner/platform provider pipeline/protocol
          node --test runner/actions/runtime.test.mjs scripts/macos-guest-test.mjs
          node --test scripts/macos-runner-lifecycle-test.cjs
          bash -n deploy/macos/install-guest.sh
          plutil -lint deploy/macos/launchd.plist

  frontend:
    name: Frontend checks
    uses: ./.github/workflows/frontend-checks.yml

  build-deploy-regressions:
    name: Build and deployment regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test build, deployment and Compose scripts
        run: |
          node --test \
            scripts/acceptance-http-proxy-test.mjs \
            scripts/run-native-test-test.cjs \
            scripts/apt-config-test.cjs \
            scripts/base-image-test.cjs \
            scripts/deploy-script-test.cjs \
            scripts/github-deploy-test.cjs \
            scripts/moonbit-install-test.cjs \
            scripts/production-deploy-test.cjs \
            scripts/shared-build-test.cjs \
            scripts/shared-host-test.cjs
      - name: Test pipeline Compose configuration
        run: node scripts/pipeline-deployment-smoke.cjs
      - name: Test identity transfer
        run: python3 scripts/identity-transfer-test.py

  required:
    name: CI required
    if: ${{ always() }}
    needs: [self-check, docker-ssh, windows-runner, macos-runner, frontend, build-deploy-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          SELF_CHECK_RESULT: ${{ needs.self-check.result }}
          DOCKER_SSH_RESULT: ${{ needs.docker-ssh.result }}
          WINDOWS_RUNNER_RESULT: ${{ needs.windows-runner.result }}
          MACOS_RUNNER_RESULT: ${{ needs.macos-runner.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BUILD_DEPLOY_RESULT: ${{ needs.build-deploy-regressions.result }}
        run: |
          test "$SELF_CHECK_RESULT" = success
          test "$DOCKER_SSH_RESULT" = success
          test "$WINDOWS_RUNNER_RESULT" = success
          test "$MACOS_RUNNER_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BUILD_DEPLOY_RESULT" = success

  deploy:
    needs: required
    if: >-
      ${{ needs.required.result == 'success' &&
          github.repository == 'moonbitlang/moonhub' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      deploy: ${{ inputs.deploy || false }}
