services:
  web:
    image: ${MOONHUB_IMAGE:-moonhub:local}
    build:
      context: .
      args:
        MOONHUB_BASE_IMAGE: ${MOONHUB_BASE_IMAGE:-moonhub-base:local}
    restart: unless-stopped
    ports:
      - "${MOONHUB_HTTP_BIND:-127.0.0.1}:${MOONHUB_HTTP_PORT:-8080}:8080"
    environment:
      MOONHUB_ROOT_USER: ${MOONHUB_ROOT_USER:-root}
      MOONHUB_ROOT_PASSWORD_FILE: /run/secrets/root_password
      MAIL_OUTBOX_DIR: /data/mail_outbox
      MOONHUB_WEB_MOONDIFF: ${MOONHUB_WEB_MOONDIFF:-true}
      MOONHUB_DIFF_WORKER: ${MOONHUB_DIFF_WORKER:-moonhub-diff-worker}
      MOONHUB_DIFF_CONCURRENCY: ${MOONHUB_DIFF_CONCURRENCY:-1}
      MOONHUB_DIFF_DEADLINE_MS: ${MOONHUB_DIFF_DEADLINE_MS:-5000}
      MOONHUB_DIFF_CACHE_BYTES: ${MOONHUB_DIFF_CACHE_BYTES-33554432}
      MOONHUB_RELEASE_ORIGIN: ${MOONHUB_RELEASE_ORIGIN:-}
      MOONHUB_WEBHOOK_ALLOWED_ORIGINS: ${MOONHUB_WEBHOOK_ALLOWED_ORIGINS:-}
      MOONHUB_IMPORT_TIMEOUT_SECONDS: ${MOONHUB_IMPORT_TIMEOUT_SECONDS:-300}
      MOONHUB_SSH_PUBLIC_URL: ${MOONHUB_SSH_PUBLIC_URL:-}
      MOONHUB_SSH_INTERNAL_URL: ${MOONHUB_SSH_INTERNAL_URL:-ssh://git@ssh:2222}
    volumes:
      - data:/data
      - ${MOONHUB_SSH_IMPORT_DIR:-./deploy/ssh-import}:/run/secrets/ssh-import:ro
    secrets:
      - root_password
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/-/login)\" = 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s

  ssh:
    image: ${MOONHUB_IMAGE:-moonhub:local}
    command: ["ssh"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${MOONHUB_SSH_BIND:-0.0.0.0}:${MOONHUB_SSH_PORT:-2222}:2222"
    volumes:
      - data:/data
      - ssh-host-keys:/var/lib/moonhub/ssh
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -t ed25519 -T 3 -p 2222 127.0.0.1 2>/dev/null | grep -q ssh-ed25519"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

volumes:
  data:
    name: ${MOONHUB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_data}
  ssh-host-keys:
    name: ${MOONHUB_SSH_KEYS_VOLUME:-${COMPOSE_PROJECT_NAME}_ssh-host-keys}

secrets:
  root_password:
    file: ${MOONHUB_ROOT_PASSWORD_FILE:-./deploy/secrets/root_password}
